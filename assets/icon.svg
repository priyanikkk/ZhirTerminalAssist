<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgGrad)" stroke="#4338ca" stroke-width="4"/>

  <!-- Terminal Window Header -->
  <rect x="48" y="48" width="416" height="56" rx="16" fill="#1e293b" opacity="0.8"/>
  <circle cx="80" cy="76" r="10" fill="#ef4444"/>
  <circle cx="112" cy="76" r="10" fill="#f59e0b"/>
  <circle cx="144" cy="76" r="10" fill="#10b981"/>

  <!-- Command Prompt Symbol >_ -->
  <path d="M 120 180 L 220 256 L 120 332" fill="none" stroke="url(#accentGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <rect x="248" y="316" width="100" height="28" rx="8" fill="#38bdf8" filter="url(#glow)"/>

  <!-- AI Sparkle / Star in top right of terminal body -->
  <path d="M 370 170 C 370 200, 395 210, 420 210 C 395 210, 370 220, 370 250 C 370 220, 345 210, 320 210 C 345 210, 370 200, 370 170 Z" fill="url(#accentGrad)" filter="url(#glow)"/>
  <circle cx="410" cy="150" r="6" fill="#c084fc"/>
  <circle cx="330" cy="270" r="5" fill="#38bdf8"/>
</svg>
