[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zhirterminalassist"
version = "1.0.0"
description = "AI-powered Linux Terminal Assistant and Diagnostics"
readme = "README.md"
authors = [{ name = "priyanikkk" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "pygments>=2.16.0"
]

[project.scripts]
zhirta = "zhirterminalassist.cli:main"

[tool.setuptools.packages.find]
include = ["zhirterminalassist*"]
